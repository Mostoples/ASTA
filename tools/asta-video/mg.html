<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ASTA — motion graphic video</title>
<!--
  Adegan motion graphic untuk video semifinal HRIE 2026.

  Setiap adegan digerakkan oleh waktu (window.setTime(t)), bukan oleh
  animasi CSS: render-mg.js menyetel t per frame lalu memotret, jadi
  hasilnya deterministik dan terkunci pada 30 fps.

  Kemunculan elemen disinkronkan dengan KATA yang diucapkan narasi:
  build.py menghitung waktu kata dari words.json dan mengirimkannya
  sebagai `cues` (detik relatif terhadap awal adegan).

  Parameter kueri:  scene, dur, cues (JSON)

  Isi teks hanya memuat hal yang ada di naskah, rekaman voice over,
  konfigurasi alat (js/core/device.js), atau landing page asta-id.web.app.
-->
<style>
  :root{
    --navy:#134896; --navy-2:#0d3068; --blue:#2f7fe0; --sky:#d6f0ff;
    --amber:#f2a71b; --teal:#10a5a5; --ink:#0e2038; --muted:#4a678a;
    --night:#060c17; --night-2:#0b1a30;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;text-rendering:geometricPrecision}
  body.light{color:var(--ink);background:
    radial-gradient(1200px 820px at 14% -12%,#eaf6ff 0%,transparent 60%),
    radial-gradient(900px 700px at 98% 110%,#e2f1ff 0%,transparent 55%),
    linear-gradient(160deg,#ffffff 0%,#f3f9ff 58%,#eaf4ff 100%)}
  body.dark{color:#fff;background:
    radial-gradient(1100px 760px at 50% 44%,#10233f 0%,transparent 70%),
    linear-gradient(180deg,var(--night) 0%,#07101f 100%)}
  #root{position:absolute;inset:0}
  .abs{position:absolute}
  .eyebrow{font-size:19px;letter-spacing:.3em;text-transform:uppercase;font-weight:800;color:var(--blue)}
  .dark .eyebrow{color:#7fb8ff}
  h2{font-size:60px;line-height:1.06;letter-spacing:-.026em;font-weight:800;margin:14px 0 0;color:var(--navy-2)}
  .dark h2{color:#fff}
  .sub{font-size:24px;line-height:1.45;color:var(--muted);margin-top:14px;max-width:62ch}
  .head{position:absolute;left:150px;top:92px;right:150px}

  /* kartu isi */
  .box{background:#fff;border:2px solid rgba(19,72,150,.14);border-radius:22px;
    box-shadow:0 22px 44px -28px rgba(19,72,150,.55)}
  .num{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
    font-size:22px;font-weight:800;color:#fff;background:linear-gradient(140deg,var(--blue),var(--navy))}
  .chip{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;
    font-size:23px;font-weight:700;color:var(--navy-2);background:#fff;
    border:2px solid rgba(19,72,150,.18);box-shadow:0 14px 28px -20px rgba(19,72,150,.6)}
  .on{border-color:var(--blue)!important}
  .dim{opacity:.25}

  /* tipografi kinetik (tema gelap) */
  .kin{position:absolute;left:0;right:0;text-align:center;font-weight:700;letter-spacing:-.02em}
  .accent{color:#8fd0ff}
  .amber{color:var(--amber)}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ============================================================
   Pembantu animasi — semua fungsi murni terhadap t
   ============================================================ */
function clamp(x,a,b){return x<a?a:x>b?b:x}
function prog(t,a,d){return clamp((t-a)/(d||.5),0,1)}
function eo(x){return 1-Math.pow(1-x,3)}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function lerp(a,b,x){return a+(b-a)*x}
function $(id){return document.getElementById(id)}
function h(tag,attrs,html){var e=document.createElement(tag);
  for(var k in (attrs||{})){ if(k==='style') e.style.cssText=attrs[k]; else e.setAttribute(k,attrs[k]); }
  if(html!=null) e.innerHTML=html; return e}
/* muncul: fade + naik, lalu (opsional) pudar di akhir adegan */
function show(el,t,a,d,dy){var p=eo(prog(t,a,d||.45));
  el.style.opacity=p.toFixed(3);
  el.style.transform='translateY('+((1-p)*(dy==null?26:dy)).toFixed(2)+'px)';}
function pop(el,t,a,d){var p=eo(prog(t,a,d||.35));
  el.style.opacity=p.toFixed(3); el.style.transform='scale('+(0.86+0.14*p).toFixed(4)+')';}
function draw(path,t,a,d){ // garis tergambar lewat stroke-dashoffset
  var L=path.__len||(path.__len=path.getTotalLength()); var p=eio(prog(t,a,d||.6));
  path.style.strokeDasharray=L; path.style.strokeDashoffset=(L*(1-p)).toFixed(2);}
function sceneFade(t,dur){ // pudar masuk/keluar lembut di tepi adegan
  var a=prog(t,0,.25), b=1-prog(t,dur-.3,.3); $('root').style.opacity=Math.min(a,b).toFixed(3);}

var NS='http://www.w3.org/2000/svg';
function svg(w,hh,inner,style){return '<svg xmlns="'+NS+'" width="'+w+'" height="'+hh+'" viewBox="0 0 '+w+' '+hh+
  '" style="'+(style||'')+'">'+inner+'</svg>'}

/* ------------------------------------------------------------
   Piktogram tangan manusia (garis). Jari digambar sebagai ruas
   yang dapat ditekuk; `curl` 0 = terbuka, 1 = menggenggam.
   ------------------------------------------------------------ */
function handSVG(id,color){
  var fingers='';
  var base=[[-54,-8],[-18,-22],[18,-22],[52,-10]];   // pangkal jari telunjuk..kelingking
  var len=[74,82,76,62];
  for(var i=0;i<4;i++){
    fingers+='<g id="'+id+'f'+i+'" transform="translate('+base[i][0]+' '+base[i][1]+')">'+
      '<line x1="0" y1="0" x2="0" y2="-'+(len[i]*.55)+'" stroke="'+color+'" stroke-width="22" stroke-linecap="round"/>'+
      '<g id="'+id+'f'+i+'b" transform="translate(0 -'+(len[i]*.55)+')">'+
      '<line x1="0" y1="0" x2="0" y2="-'+(len[i]*.45)+'" stroke="'+color+'" stroke-width="20" stroke-linecap="round"/></g></g>';
  }
  var thumb='<g id="'+id+'th" transform="translate(-74 40)">'+
    '<line x1="0" y1="0" x2="-30" y2="-52" stroke="'+color+'" stroke-width="22" stroke-linecap="round"/></g>';
  var palm='<rect x="-76" y="-30" width="152" height="120" rx="46" fill="none" stroke="'+color+'" stroke-width="10"/>'+
    '<line x1="0" y1="90" x2="0" y2="190" stroke="'+color+'" stroke-width="10" stroke-linecap="round" opacity=".55"/>';
  return '<g id="'+id+'">'+palm+fingers+thumb+'</g>';
}
function setCurl(id,c){
  for(var i=0;i<4;i++){
    var a=$(id+'f'+i), b=$(id+'f'+i+'b');
    a.setAttribute('transform', a.getAttribute('transform').replace(/ rotate\([^)]*\)/,'')+' rotate('+(c*62).toFixed(2)+')');
    b.setAttribute('transform', b.getAttribute('transform').replace(/ rotate\([^)]*\)/,'')+' rotate('+(c*78).toFixed(2)+')');
  }
  var th=$(id+'th');
  th.setAttribute('transform', th.getAttribute('transform').replace(/ rotate\([^)]*\)/,'')+' rotate('+(c*48).toFixed(2)+')');
}
var BOTTLE='<g id="bottle"><rect x="-38" y="-120" width="76" height="210" rx="20" fill="none" stroke="#8fd0ff" stroke-width="9"/>'+
  '<rect x="-20" y="-150" width="40" height="34" rx="8" fill="none" stroke="#8fd0ff" stroke-width="9"/>'+
  '<line x1="-38" y1="-40" x2="38" y2="-40" stroke="#8fd0ff" stroke-width="6" opacity=".5"/></g>';
var BOOK='<g id="book"><rect x="-80" y="-100" width="160" height="200" rx="12" fill="none" stroke="#f2a71b" stroke-width="9"/>'+
  '<line x1="-52" y1="-100" x2="-52" y2="100" stroke="#f2a71b" stroke-width="7" opacity=".6"/>'+
  '<line x1="-30" y1="-40" x2="50" y2="-40" stroke="#f2a71b" stroke-width="6" opacity=".5"/>'+
  '<line x1="-30" y1="-10" x2="40" y2="-10" stroke="#f2a71b" stroke-width="6" opacity=".5"/></g>';

/* ------------------------------------------------------------
   Ikon kecil (garis) untuk kartu isi
   ------------------------------------------------------------ */
var IC={
  coin:'<circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M24 14v20M19 19h7.5a3.5 3.5 0 0 1 0 7H20h7a3.5 3.5 0 0 1 0 7h-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
  road:'<path d="M14 42 20 6M34 42 28 6M24 12v5M24 22v5M24 32v5" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>',
  people:'<circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="3.2"/><circle cx="33" cy="18" r="5" fill="none" stroke="currentColor" stroke-width="3.2"/><path d="M5 40c1-8 6-12 11-12s10 4 11 12M26 40c1-6 4-9 8-9s7 3 8 9" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>',
  user:'<circle cx="24" cy="15" r="8" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M8 42c2-10 8-15 16-15s14 5 16 15" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>',
  steth:'<path d="M12 6v12a10 10 0 0 0 20 0V6M22 28v6a8 8 0 0 0 16 0v-4" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><circle cx="38" cy="27" r="4" fill="none" stroke="currentColor" stroke-width="3.2"/>',
  tool:'<path d="M30 8a9 9 0 0 0-8 12L8 34l6 6 14-14a9 9 0 0 0 12-8l-5 5-6-1-1-6z" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>',
  gear:'<circle cx="24" cy="24" r="7" fill="none" stroke="currentColor" stroke-width="3.4"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M10.6 37.4l4.2-4.2M33.2 14.8l4.2-4.2" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>',
  chip:'<rect x="12" y="12" width="24" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="3.4"/><path d="M18 6v6M30 6v6M18 36v6M30 36v6M6 18h6M6 30h6M36 18h6M36 30h6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
  wave:'<path d="M4 26h7l4-12 6 22 6-26 5 18 4-8h8" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>',
  pulse:'<circle cx="24" cy="24" r="5" fill="currentColor"/><circle cx="24" cy="24" r="12" fill="none" stroke="currentColor" stroke-width="3" opacity=".6"/><circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="3" opacity=".3"/>',
  phone:'<rect x="13" y="5" width="22" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="3.4"/><path d="M20 37h8" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>',
  check:'<path d="M10 25l9 9 19-20" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>',
  print:'<rect x="10" y="8" width="28" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="3.2"/><rect x="6" y="20" width="36" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="3.2"/><rect x="14" y="30" width="20" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="3.2"/>',
  link:'<path d="M20 28l8-8M17 22l-4 4a6 6 0 0 0 8.5 8.5l4-4M31 26l4-4a6 6 0 0 0-8.5-8.5l-4 4" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>',
  shield:'<path d="M24 5 38 11v11c0 9-6 16-14 20C16 38 10 31 10 22V11z" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/><path d="M18 24l5 5 8-9" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>'
};
function icon(name,size,color){return '<svg viewBox="0 0 48 48" width="'+(size||44)+'" height="'+(size||44)+'" style="color:'+(color||'var(--blue)')+'">'+IC[name]+'</svg>'}

/* ============================================================
   ADEGAN
   Setiap adegan: theme, build(P), update(t,P). P = {dur, cues}
   ============================================================ */
var SC = {};

/* ---------- S1: "Setiap hari, kita melakukan ratusan gerakan." ---------- */
SC.hari = { theme:'dark',
  build:function(P){
    var r=$('root');
    // "ratusan": kisi titik gerak yang muncul bertahap
    var g='';
    for(var y=0;y<9;y++) for(var x=0;x<20;x++){
      var cx=150+x*84, cy=150+y*96;
      g+='<circle class="dot" cx="'+cx+'" cy="'+cy+'" r="5" fill="#8fd0ff" opacity="0"/>';
    }
    r.appendChild(h('div',{class:'abs',style:'inset:0'},svg(1920,1080,g)));
    r.appendChild(h('div',{id:'l1',class:'kin',style:'top:392px;font-size:64px;color:#cfe3ff;font-weight:600'},'Setiap hari,'));
    r.appendChild(h('div',{id:'l2',class:'kin',style:'top:478px;font-size:64px;color:#cfe3ff;font-weight:600'},'kita melakukan'));
    r.appendChild(h('div',{id:'l3',class:'kin accent',style:'top:572px;font-size:112px;font-weight:800'},'ratusan gerakan.'));
    this.dots=[].slice.call(document.querySelectorAll('.dot'));
    // urutan kemunculan acak tetapi deterministik
    var s=7; this.order=this.dots.map(function(_,i){s=(s*9301+49297)%233280;return [s/233280,i]}).sort(function(a,b){return a[0]-b[0]});
  },
  update:function(t,P){
    var c=P.cues; show($('l1'),t,c.setiap||.1); show($('l2'),t,(c.kita||.9)); pop($('l3'),t,c.ratusan||1.8,.5);
    var a=c.ratusan||1.8, n=this.order.length;
    for(var k=0;k<n;k++){ var d=this.dots[this.order[k][1]];
      var p=eo(prog(t,a+k*(Math.max(.6,P.dur-a-.5)/n),.25));
      d.setAttribute('opacity',(p*.55).toFixed(3)); }
    sceneFade(t,P.dur);
  }};

/* ---------- S2: "Tanpa pernah benar-benar memikirkannya." ---------- */
SC.tanpa = { theme:'dark',
  build:function(P){
    var r=$('root');
    var words='Tanpa pernah benar-benar memikirkannya.'.split(' ');
    var line=h('div',{class:'kin',style:'top:470px;font-size:74px;font-weight:700'});
    words.forEach(function(w,i){ line.appendChild(h('span',{class:'w',style:'display:inline-block;margin:0 .16em'},w)); });
    r.appendChild(line);
    r.appendChild(h('div',{class:'kin',style:'top:600px;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:#6f8db3;font-weight:700',id:'auto'},'otomatis · tanpa disadari'));
    this.w=[].slice.call(document.querySelectorAll('.w'));
  },
  update:function(t,P){
    var a=P.cues.tanpa||.1, b=P.cues.memikirkannya||1.6, n=this.w.length;
    for(var i=0;i<n;i++) show(this.w[i],t,lerp(a,b,i/(n-1)),.4,18);
    show($('auto'),t,b+.3,.5); sceneFade(t,P.dur);
  }};

/* ---------- S3–S5: menggenggam / mengangkat / menjangkau ---------- */
function actionScene(kind,no,word){ return { theme:'dark',
  build:function(P){
    var r=$('root'); var obj=(kind==='jangkau')?BOOK:BOTTLE;
    // piktogram diperbesar 1,3x: isinya hanya menempati x 150–520 pada svg 800
    r.appendChild(h('div',{class:'abs',style:'left:150px;top:40px;transform:scale(1.3);transform-origin:0 0'},
      svg(800,800,'<g transform="translate(470 470)">'+obj+'</g><g id="hmove" transform="translate(300 520)">'+handSVG('H','#ffffff')+'</g>')));
    r.appendChild(h('div',{id:'no',class:'abs',style:'left:1060px;top:360px;font-size:30px;letter-spacing:.3em;font-weight:800;color:#6f8db3'},no+' / 03'));
    r.appendChild(h('div',{id:'wd',class:'abs',style:'left:1052px;top:410px;font-size:118px;font-weight:800;letter-spacing:-.03em'},word));
    r.appendChild(h('div',{id:'ln',class:'abs',style:'left:1060px;top:560px;height:8px;width:0;border-radius:4px;background:linear-gradient(90deg,#8fd0ff,#f2a71b)'}));
  },
  update:function(t,P){
    var d=P.dur, p=eio(prog(t,.15,Math.min(1.3,d-.4)));
    var hx=300, hy=520, curl=0;
    if(kind==='genggam'){ hx=lerp(250,400,p); hy=lerp(560,540,p); curl=eo(prog(t,.7,.7)); }
    if(kind==='angkat'){ curl=1; hx=400; hy=lerp(540,380,p);
      $('bottle').setAttribute('transform','translate(0 '+lerp(0,-160,p).toFixed(1)+')'); }
    if(kind==='jangkau'){ hx=lerp(150,330,p); hy=lerp(600,540,p); curl=lerp(.4,0,p); }
    $('hmove').setAttribute('transform','translate('+hx.toFixed(1)+' '+hy.toFixed(1)+')');
    setCurl('H',curl);
    show($('no'),t,.05,.4); pop($('wd'),t,.1,.45);
    $('ln').style.width=(eo(prog(t,.3,.8))*380).toFixed(1)+'px';
    sceneFade(t,P.dur);
  }};}
SC.genggam = actionScene('genggam','01','Menggenggam');
SC.angkat  = actionScene('angkat','02','Mengangkat');
SC.jangkau = actionScene('jangkau','03','Menjangkau');

/* ---------- S6: "…sampai kita tidak lagi bisa." — tangan berhenti ---------- */
SC.berhenti = { theme:'dark',
  build:function(P){
    var r=$('root');
    r.appendChild(h('div',{class:'abs',style:'left:560px;top:120px'},
      svg(800,640,'<g transform="translate(560 330)">'+BOTTLE+'</g><g id="hmove" transform="translate(120 380)">'+handSVG('H','#ffffff')+'</g>'+
      '<line id="gap" x1="330" y1="330" x2="470" y2="330" stroke="#f2a71b" stroke-width="5" stroke-dasharray="10 12" opacity="0"/>')));
    r.appendChild(h('div',{id:'tx',class:'kin',style:'top:800px;font-size:66px;font-weight:700'},
      'sampai kita <span class="amber">tidak lagi bisa.</span>'));
  },
  update:function(t,P){
    var c=P.cues, p=eio(prog(t,.05,Math.max(.8,(c.tidak||1.4)-.1)));
    var hx=lerp(120,300,p);
    $('hmove').setAttribute('transform','translate('+hx.toFixed(1)+' 380)'); setCurl('H',.15);
    // pada kata "tidak": tangan berhenti, meredup, celah tak terjangkau tampak
    var s=prog(t,c.tidak||1.4,.6);
    $('hmove').style.opacity=(1-.72*s).toFixed(3);
    $('gap').setAttribute('opacity',(s*.9).toFixed(3));
    show($('tx'),t,c.sampai||.1,.5);
    // pudar ke hitam di akhir (naskah: cut to black)
    var out=1-prog(t,P.dur-.55,.5); $('root').style.opacity=Math.min(prog(t,0,.25),out).toFixed(3);
  }};

/* ---------- S7 (akhir): kalimat naskah yang tidak terekam, sebagai teks ---------- */
SC.pertanyaan = { theme:'dark',
  build:function(){
    var r=$('root');
    r.appendChild(h('div',{id:'q1',class:'kin',style:'top:410px;font-size:56px;font-weight:600;color:#cfe3ff'},
      'bukan sekadar menggantikan gerakan —'));
    // dua baris: dalam satu baris kalimat ini melebar sampai terpotong di tepi layar
    r.appendChild(h('div',{id:'q2',class:'kin',style:'top:490px;font-size:60px;font-weight:800;line-height:1.2'},
      'tetapi dirancang untuk<br><span class="accent">memahami kebutuhan penggunanya.</span>'));
  },
  update:function(t,P){ show($('q1'),t,.15,.5); show($('q2'),t,1.0,.6); sceneFade(t,P.dur); }};

/* ---------- S9 (tengah): tiga hambatan ---------- */
SC.masalah = { theme:'light',
  build:function(){
    var r=$('root');
    r.appendChild(h('div',{class:'head'},'<div class="eyebrow">Latar belakang</div><h2>Mengapa ASTA dibutuhkan?</h2>'));
    var items=[
      ['coin','Biaya','Harga lengan prostetik fungsional menjadi hambatan untuk memilikinya.'],
      ['road','Akses layanan','Kontrol rutin menuntut perjalanan berulang ke pusat rehabilitasi.'],
      ['people','Kebutuhan berbeda','Tungkai sisa, kekuatan otot, dan tujuan rehabilitasi setiap orang tidak sama.']];
    items.forEach(function(it,i){
      r.appendChild(h('div',{id:'m'+i,class:'abs box',style:'left:'+(150+i*550)+'px;top:380px;width:510px;height:290px;padding:38px 40px'},
        '<div style="display:flex;align-items:center;gap:18px">'+icon(it[0],56)+
        '<div style="font-size:34px;font-weight:800;color:var(--navy-2)">'+it[1]+'</div></div>'+
        '<div style="margin-top:22px;font-size:24px;line-height:1.5;color:var(--muted)">'+it[2]+'</div>'));
    });
    r.appendChild(h('div',{id:'con',class:'abs',style:'left:150px;right:150px;top:760px;padding:30px 42px;border-radius:22px;'+
      'background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;gap:22px'},
      icon('check',48,'#fff')+'Dibutuhkan teknologi asistif yang dapat menyesuaikan kebutuhan penggunanya.'));
  },
  update:function(t,P){ var c=P.cues;
    show($('m0'),t,c.biaya||.8); show($('m1'),t,c.akses||1.8); show($('m2'),t,c.kebutuhan||3.4);
    show($('con'),t,c.karena||6.5,.55); sceneFade(t,P.dur); }};

/* ---------- S11 (kalimat 2): User-Centered Design ---------- */
SC.ucd = { theme:'light',
  build:function(){
    var r=$('root');
    r.appendChild(h('div',{class:'head'},'<div class="eyebrow">Metode · User-Centered Design</div>'+
      '<h2>Kebutuhan digali langsung dari pengguna</h2>'));
